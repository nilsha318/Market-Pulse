# n8n locally for the course. Start: docker compose up -d  ·  Stop: docker compose down
services:
  n8n:
    image: n8nio/n8n:2.43.8
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - GENERIC_TIMEZONE=Europe/Vienna
      - TZ=Europe/Vienna
      - N8N_RESTRICT_FILE_ACCESS_TO=/home/node/.n8n-files
    volumes:
      - n8n_data:/home/node/.n8n
      - ../data:/home/node/.n8n-files:ro

volumes:
  n8n_data:
